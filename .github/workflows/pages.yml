name: Publish Novaya Glava to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "career-guide/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the site
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Upload the career guide
        uses: actions/upload-pages-artifact@v5
        with:
          path: career-guide

  deploy:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the career guide
        id: deployment
        uses: actions/deploy-pages@v5.0.1
